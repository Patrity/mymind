packages:
  - packages/*
  - apps/*

allowBuilds:
  '@parcel/watcher': false
  '@tailwindcss/oxide': false
  esbuild: false
  maplibre-gl: false
  protobufjs: false
  sharp: true
  unrs-resolver: false
  vue-demi: false

# One shiki for the whole app. @nuxtjs/mdc asks for ^4.0.2 (locked at 4.1.0) while the AI
# Elements CodeBlock uses shiki/core ^4.4.3; without this the client bundles two copies of
# @shikijs/core + the JS regex engine. Ranges, not pins, so a shiki bump stays one edit.
overrides:
  shiki: ^4.4.3
  '@shikijs/core': ^4.4.3
  '@shikijs/engine-javascript': ^4.4.3
  '@shikijs/engine-oniguruma': ^4.4.3
  '@shikijs/langs': ^4.4.3
  '@shikijs/primitive': ^4.4.3
  '@shikijs/themes': ^4.4.3
  '@shikijs/transformers': ^4.4.3
  '@shikijs/types': ^4.4.3

# Cycle 86: prod runs on the Mac mini (darwin/arm64) but CD builds in LXC 114 (linux/x64). Install
# the mini's prebuilt native binaries (sharp's @img/*, @napi-rs/canvas) next to the build box's own,
# so the web .output (nft copies every installed sharp platform package) and the staged worker
# release (stage.mjs copies the closure) both carry them. A change here needs a CLEAN node_modules:
# pnpm reports "Already up to date" otherwise (build-artifacts.sh checks for the darwin package).
# os × cpu is a cross product (it also installs linux-arm64 and darwin-x64); build-artifacts.sh drops
# those from the shipped releases, so only linux-x64 (this box) and darwin-arm64 (the mini) ship.
supportedArchitectures:
  os: [current, darwin]
  cpu: [current, arm64]
  libc: [current]
